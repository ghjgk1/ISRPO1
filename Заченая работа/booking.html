<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car&Drive - Бронирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/svg/logo.svg" alt="Car&Drive Logo">
            <span>Car&Drive</span>
        </div>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="booking.html" class="active">Бронирование</a>
            <a href="profile.html">Личный кабинет</a>
        </nav>
    </header>

    <main class="main booking-page">
        <h1>Бронирование автомобиля</h1>
        
        <div class="booking-form">
            <div class="car-info">
                <h3>Данные об автомобиле</h3>
                <p>VIN: ABC123456789</p>
                <p>Марка: Toyota</p>
                <p>Модель: Camry</p>
                <p>Номер: A123BC</p>
                <input type="date" placeholder="Дата бронирования">
                <input type="date" placeholder="Дата возврата">
                <input type="text" placeholder="Стоимость в день">
                <select>
                    <option>Выберите филиал</option>
                    <option>Филиал 1</option>
                    <option>Филиал 2</option>
                </select>
            </div>
            
            <div class="client-info">
                <h3>Данные клиента</h3>
                <input type="text" placeholder="Имя">
                <input type="text" placeholder="Фамилия">
                <input type="text" placeholder="Отчество">
                <input type="tel" placeholder="Телефон">
                <input type="text" placeholder="Паспортные данные">
                <select>
                    <option>Выберите карту</option>
                    <option>**** 1234</option>
                </select>
                <input type="date" placeholder="Дата рождения">
            </div>
        </div>
        
        <div class="booking-actions">
            <button>Забронировать</button>
            <button>Добавить</button>
            <button>Оформить бронирование</button>
        </div>
        
        <div class="total-price">
            <h3>Итоговая стоимость: 0 руб.</h3>
        </div>
    </main>
</body>
</html>
