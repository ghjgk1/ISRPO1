<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car&Drive - Филиалы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/svg/logo.svg" alt="Car&Drive Logo">
            <span>Car&Drive</span>
        </div>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="branches.html" class="active">Филиалы</a>
            <a href="profile.html">Личный кабинет</a>
        </nav>
    </header>

    <main class="main branches-page">
        <h1>Наши филиалы</h1>
        
        <div class="map-container">
            <img src="img/maps/Moskow.png" alt="Карта" class="map">
            <div class="branch-marker" style="top: 100px; left: 200px;">1</div>
            <div class="branch-marker" style="top: 150px; left: 300px;">2</div>
            <div class="branch-marker" style="top: 200px; left: 400px;">3</div>
            <div class="branch-marker" style="top: 250px; left: 350px;">4</div>
            <div class="branch-marker" style="top: 300px; left: 250px;">5</div>
        </div>
        
        <div class="branch-cars">
            <h3>Доступные автомобили в филиале 1</h3>
            <div class="car-list">
                <div class="car-item">
                    <img src="img/cars/blue-tayota.png" alt="Автомобиль">
                    <p>Toyota Camry</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
