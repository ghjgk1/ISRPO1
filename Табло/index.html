<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Футбольное табло</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="team">
                <div class="team-name">Команда 1</div>
                <div class="score" id="team1-score">0</div>
            </div>
            <div class="vs">VS</div>
            <div class="team">
                <div class="team-name">Команда 2</div>
                <div class="score" id="team2-score">0</div>
            </div>
        </div>
        
        <div class="controls">
            <button id="goal-btn">Гол</button>
            <button id="check-btn">Проверить результат</button>
        </div>
        
        <div class="result" id="result-display"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
